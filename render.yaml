services:
  - type: web
    name: presign-guard
    runtime: node
    plan: starter # always on: the CDP Bazaar curation tier needs >= 99% availability; Free sleeps after 15 min
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: X402_NETWORK
        value: eip155:8453 # Base mainnet (needs CDP_API_KEY_ID/SECRET); eip155:84532 = Base Sepolia for testing
      - key: PAY_TO
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOPLUS_ACCESS_TOKEN
        sync: false
      - key: CDP_API_KEY_ID
        sync: false
      - key: CDP_API_KEY_SECRET
        sync: false
      - key: USAGE_LOG_TOKEN
        sync: false
      - key: PG1_API_KEY # PG1 membership key: exempt from PG1's anonymous rate limit (optional)
        sync: false
      - key: USAGE_LOG_REPO
        value: Fizzl13/usage-log
