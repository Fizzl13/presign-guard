name: Publish to MCP registry

# Publishes server.json (the remote /mcp endpoint) to the official MCP
# registry. Uses GitHub OIDC for the io.github.Fizzl13/* namespace: no secrets.
on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The registry probes nothing, but a sleeping Render instance makes the
      # listing look dead to the first visitors; wake it and check /mcp.
      - name: Check the live MCP endpoint
        run: |
          curl -s -o /dev/null --retry 5 --retry-delay 10 --max-time 90 https://presign-guard.onrender.com/
          curl -sf --max-time 60 https://presign-guard.onrender.com/mcp \
            -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | tee tools.json
          grep -q presign_quick_check tools.json
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --version || true
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
